 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
    <div class="container">
        <h2>Contact Us</h2>
        <form id="contactForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" class="form-field" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" class="form-field" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" class="form-field" rows="5" required></textarea>

            <button type="submit" id="submitBtn" class="submit-btn">Send Message</button>
        </form>
    </div>
</body>
</html>
