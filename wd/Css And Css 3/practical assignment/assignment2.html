<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <div class="card">
        <div class="profile">
            <img src="img/virat kohli.jpg" alt="Profile Picture" class="profile-pic">
        </div>
        
        <div class="card-content">
            <h2 class="name">Virat Kohli</h2>
            <p class="bio">Virat Kohli is an Indian international cricketer who plays Test and ODI cricket for the Indian national team. </p>
            <button class="follow-btn">Follow</button>
        </div>
    </div>
</body>
</html>
