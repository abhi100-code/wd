<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
    <div class="product-grid">
        <!-- Product Card 1 -->
        <div class="product-card">
            <img src="img/cart2.jpg" alt="Product 1" class="product-image">
            <h3 class="product-title">Product 1</h3>
            <p class="product-price">$19.99</p>
        </div>

        <!-- Product Card 2 -->
        <div class="product-card">
            <img src="img/cart3.png" alt="Product 2" class="product-image">
            <h3 class="product-title">Product 2</h3>
            <p class="product-price">$29.99</p>
        </div>

        <!-- Product Card 3 -->
        <div class="product-card">
            <img src="img/cart4.jpg" alt="Product 3" class="product-image">
            <h3 class="product-title">Product 3</h3>
            <p class="product-price">$39.99</p>
        </div>

        <!-- Product Card 4 -->
        <div class="product-card">
            <img src="img/product-3.jpg" alt="Product 4" class="product-image">
            <h3 class="product-title">Product 4</h3>
            <p class="product-price">$49.99</p>
        </div>

        <!-- Product Card 5 -->
        <div class="product-card">
            <img src="img/product-4.jpg" alt="Product 5" class="product-image">
            <h3 class="product-title">Product 5</h3>
            <p class="product-price">$59.99</p>
        </div>

        <!-- Product Card 6 -->
        <div class="product-card">
            <img src="img/product-5.jpg" alt="Product 6" class="product-image">
            <h3 class="product-title">Product 6</h3>
            <p class="product-price">$69.99</p>
        </div>
    </div>
</body>
</html>
